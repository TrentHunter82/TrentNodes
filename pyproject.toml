[project]
name = "trentnodes"
description = "Comprehensive custom nodes for video processing, keyframe management, scene detection, and video analysis in ComfyUI"
version = "1.7.1"
license = { file = "LICENSE" }
# Keep this list in sync with the uncommented lines of
# requirements.txt. The Comfy Registry installs from THIS file, so
# anything missing here is simply absent for a registry install - which
# is how Cut Detective and the H3 Auto Prompt Generator shipped without
# their dependencies. OmniShotCut stays out on purpose: it is not on
# PyPI and needs --no-deps. See the comment block in requirements.txt.
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "matplotlib>=3.7.0",
    "colorama>=0.4.6",
    "timm>=1.0.0",
    "einops>=0.8.0",
    "requests>=2.28.0",
    "vosk>=0.3.45",
    "transformers>=4.36.0",
    "fal-client>=0.4.0",
    "omegaconf>=2.3.0",
    "psd-tools>=1.9.0",
    # Cut Detective's fallback detector; its weights ship in the wheel.
    "transnetv2-pytorch>=1.0.5",
    # H3 Auto Prompt Generator providers. The openai package also serves
    # kimi, glm and qwen_api; google-genai is the only backend that can
    # take the clip's audio track.
    "anthropic>=0.119.0",
    "openai>=2.0.0",
    "google-genai>=1.75.0",
]

[project.urls]
Repository = "https://github.com/TrentHunter82/TrentNodes"
Issues = "https://github.com/TrentHunter82/TrentNodes/issues"

[tool.comfy]
PublisherId = "flippingsigmas"  # Publisher ID configured
DisplayName = "Trent Nodes"
Icon = "https://ibb.co/0pKwKC71"  # Optional: Add icon URL (SVG, PNG, JPG, or GIF - max 800x400px)

# Additional metadata (optional but recommended)
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
]
